<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Space+Grotesk:wght@400..700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

","margin":"1.5rem","space-xl":"2rem","gutter":"1.25rem"},"fontFamily":{"headline-xl-mobile":["Space Grotesk"],"body-lg":["DM Sans"],"headline-lg":["Space Grotesk"],"headline-lg-mobile":["Space Grotesk"],"headline-sm":["Space Grotesk"],"label-md":["DM Sans"],"label-lg":["DM Sans"],"body-md":["DM Sans"],"body-sm":["DM Sans"],"headline-md":["Space Grotesk"],"headline-xl":["Space Grotesk"],"label-sm":["DM Sans"]},"fontSize":{"headline-xl-mobile":["32px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-lg":["18px",{"lineHeight":"26px","fontWeight":"500"}],"headline-lg":["36px",{"lineHeight":"40px","letterSpacing":"-0.025em","fontWeight":"700"}],"headline-lg-mobile":["28px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-sm":["20px",{"lineHeight":"24px","letterSpacing":"-0.015em","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"18px","letterSpacing":"0.01em","fontWeight":"700"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-sm":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"28px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-xl":["48px",{"lineHeight":"52px","letterSpacing":"-0.03em","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.03em","fontWeight":"700"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface"><main class="w-full min-h-screen bg-surface"><div class="flex flex-col w-full">
<div class="w-full max-w-6xl mx-auto px-6 py-12 lg:py-20">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-10 items-center">
<!-- Left Column: Registration Form -->
<div class="lg:col-span-6 flex flex-col items-start w-full max-w-md mx-auto lg:mx-0">
<div class="relative mb-8">
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">
            Job Application Tracker
          </h1>
<svg aria-hidden="true" class="w-64 h-4 mt-1 text-secondary-container" fill="none" viewbox="0 0 260 16" xmlns="http://www.w3.org/2000/svg">
<path d="M3 11.5C28 3.5 52 14.5 78 6.5C104 -1.5 130 13.5 156 6.5C182 -0.5 208 13.5 234 5.5C243 2.5 251 6.5 257 9.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
</svg>
</div>
<form class="w-full flex flex-col gap-5" id="register-form" novalidate="">
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface uppercase" for="name">Name</label>
<input class="w-full px-4 py-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 transition-transform" id="name" placeholder="Alex Rivera" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface uppercase" for="email">Email</label>
<input class="w-full px-4 py-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 transition-transform" id="email" placeholder="alex@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface uppercase" for="password">Password</label>
<input class="w-full px-4 py-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 transition-transform" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="mt-2 w-full py-4 px-6 bg-primary-container text-on-primary font-headline-sm text-headline-sm border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] hover:-translate-y-0.5 active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0_#111111] transition-all cursor-pointer" type="submit">
            Register
          </button>
</form>
<p class="mt-6 font-body-md text-body-md text-on-surface-variant">
          Already have an account? 
          <a class="font-label-lg text-label-lg text-primary underline decoration-2 underline-offset-4 hover:text-primary-container transition-colors" href="#login">
            Login
          </a>
</p>
</div>
<!-- Right Column: Decorative Sticker-Style Kanban Illustration -->
<div class="lg:col-span-6 relative flex items-center justify-center min-h-[440px] w-full">
<!-- Hand-drawn Stars -->
<svg aria-hidden="true" class="absolute top-4 left-8 w-8 h-8 text-tertiary-fixed-dim -rotate-12" fill="currentColor" stroke="#111111" stroke-width="2" viewbox="0 0 32 32">
<path d="M16 2L19.8 11.4L30 12.2L22.2 18.8L24.6 28.8L16 23.4L7.4 28.8L9.8 18.8L2 12.2L12.2 11.4L16 2Z"></path>
</svg>
<svg aria-hidden="true" class="absolute bottom-8 right-10 w-10 h-10 text-secondary-container rotate-12" fill="currentColor" stroke="#111111" stroke-width="2" viewbox="0 0 32 32">
<path d="M16 2L19.8 11.4L30 12.2L22.2 18.8L24.6 28.8L16 23.4L7.4 28.8L9.8 18.8L2 12.2L12.2 11.4L16 2Z"></path>
</svg>
<svg aria-hidden="true" class="absolute top-16 right-6 w-6 h-6 text-primary-fixed-dim rotate-45" fill="currentColor" stroke="#111111" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"></path>
</svg>
<!-- Tilted Kanban Cards Stack -->
<div class="relative w-full max-w-sm h-[380px] flex items-center justify-center">
<!-- Card 1: Wishlist (Lavender) -->
<div class="absolute top-2 left-2 w-64 p-5 bg-primary-fixed-dim border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] -rotate-3 hover:rotate-0 transition-transform duration-200">
<div class="flex items-center justify-between mb-3">
<span class="px-2.5 py-0.5 bg-surface-container-lowest text-on-surface font-label-sm text-label-sm uppercase border-2 border-on-surface rounded-full">
                Wishlist
              </span>
<span class="material-symbols-outlined text-on-surface text-xl">bookmark</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface">Spotify</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Product Designer</p>
</div>
<!-- Card 2: Interview (Yellow) -->
<div class="absolute top-28 right-0 w-64 p-5 bg-tertiary-fixed border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] rotate-2 hover:rotate-0 transition-transform duration-200 z-10">
<div class="flex items-center justify-between mb-3">
<span class="px-2.5 py-0.5 bg-surface-container-lowest text-on-surface font-label-sm text-label-sm uppercase border-2 border-on-surface rounded-full">
                Interview
              </span>
<span class="material-symbols-outlined text-on-surface text-xl">event</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface">Figma</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Design Engineer</p>
</div>
<!-- Card 3: Offer (Lime / Tertiary Fixed Dim) -->
<div class="absolute bottom-2 left-6 w-64 p-5 bg-tertiary-fixed-dim border-2 border-on-surface rounded-xl shadow-[4px_4px_0_#111111] -rotate-2 hover:rotate-0 transition-transform duration-200 z-20">
<div class="flex items-center justify-between mb-3">
<span class="px-2.5 py-0.5 bg-surface-container-lowest text-on-surface font-label-sm text-label-sm uppercase border-2 border-on-surface rounded-full">
                Offer
              </span>
<span class="material-symbols-outlined text-on-surface text-xl">celebration</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface">Linear</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Frontend Developer</p>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
  document.getElementById('register-form')?.addEventListener('submit', function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    if (!btn) return;
    const originalText = btn.textContent;
    btn.textContent = 'Account Created!';
    btn.classList.remove('bg-primary-container');
    btn.classList.add('bg-tertiary-fixed-dim', 'text-on-surface');
    setTimeout(() => {
      btn.textContent = originalText;
      btn.classList.add('bg-primary-container');
      btn.classList.remove('bg-tertiary-fixed-dim', 'text-on-surface');
    }, 1800);
  });
</script></main></body></html>
